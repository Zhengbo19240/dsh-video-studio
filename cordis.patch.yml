# dsh-video-suite 的 bundle 补丁：一次把工作台与阶段机挂进 profile。
#
# 为什么根包需要这个文件：
#   dsh-market / `dsh plugin add` 按「仓库根」安装，读的是根 package.json 的 dsh.bundle。
#   子包的 cordis.patch.yml 只在单独安装该子包时才生效，所以根上必须再合并一份。
#
# 关于 agent 预设（视频剪辑模式）：
#   它不是一个「插件条目」，而是一组 preset 声明，文本较长且需要独立维护，
#   所以留在 packages/video-preset 自己的 patch 里。单独装它一次即可：
#     dsh plugin --profile <name> add dsh-video-preset
- insert:
    - id: video-workbench
      name: dsh-video-workbench

    - id: dsh-video-brief
      name: dsh-video-brief
      config:
        # off / warn / enforce
        #   warn（默认）= 只记日志不拦，装上不会锁死任何操作
        #   enforce     = 按阶段矩阵真拒绝：补 brief → 写脚本并让用户确认 → 确认风格 → 改时间线 → 进 build 才能导出
        gate: warn
        # 追问轮数上限（1-20）
        maxRounds: 6
        # 槽位覆盖：按 id 打补丁；留空 = 内置 10 个
        slots: []
